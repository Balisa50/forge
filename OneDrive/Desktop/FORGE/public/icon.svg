<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background: deep charcoal with subtle gradient so it doesn't go flat black on light wallpapers -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#060608"/>
    </radialGradient>
    <linearGradient id="flame" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="innerFlame" x1="50%" y1="20%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Outer flame body. Stylized lucide-Flame silhouette, beefed up for icon use. -->
  <path
    d="M256 80
       C 215 138, 188 168, 188 220
       C 188 246, 200 264, 216 270
       C 216 240, 232 222, 248 218
       C 240 252, 246 274, 268 290
       C 296 308, 320 296, 332 276
       C 364 260, 386 224, 386 184
       C 386 152, 366 124, 340 112
       C 344 138, 332 156, 318 156
       C 296 156, 286 132, 290 100
       C 280 92, 268 84, 256 80 Z"
    fill="url(#flame)"
    stroke="#fde68a"
    stroke-width="3"
    stroke-linejoin="round"
  />
  <!-- Inner hot core -->
  <path
    d="M268 200
       C 254 222, 252 242, 264 258
       C 282 274, 308 264, 312 246
       C 316 226, 304 208, 290 200
       C 282 196, 274 196, 268 200 Z"
    fill="url(#innerFlame)"
    opacity="0.92"
  />
  <!-- THE FORGE wordmark, condensed beneath the flame -->
  <g font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="800" letter-spacing="6" text-anchor="middle">
    <text x="256" y="408" font-size="42" fill="#f59e0b">THE</text>
    <text x="256" y="456" font-size="56" fill="#fef3c7">FORGE</text>
  </g>
</svg>
