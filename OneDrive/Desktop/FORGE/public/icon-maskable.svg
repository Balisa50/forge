<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#060608"/>
    </linearGradient>
    <linearGradient id="fl" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="fl2" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Dark background, rounded square -->
  <rect width="512" height="512" rx="88" fill="url(#bg)"/>

  <!-- Outer compass ring -->
  <circle cx="256" cy="246" r="196" fill="none" stroke="#f59e0b" stroke-width="5" opacity="0.55"/>

  <!-- Cardinal spikes -->
  <polygon points="256,50 248,88 264,88" fill="#f59e0b" opacity="0.9"/>
  <polygon points="256,442 248,404 264,404" fill="#f59e0b" opacity="0.4"/>
  <polygon points="452,246 414,238 414,254" fill="#f59e0b" opacity="0.4"/>
  <polygon points="60,246 98,238 98,254" fill="#f59e0b" opacity="0.4"/>

  <!-- Gear ring (dashed circle) -->
  <circle cx="256" cy="246" r="162" fill="none" stroke="#1f2937" stroke-width="22" stroke-dasharray="20 11"/>
  <circle cx="256" cy="246" r="162" fill="none" stroke="#374151" stroke-width="6" stroke-dasharray="20 11"/>

  <!-- Anvil -->
  <rect x="212" y="326" width="88" height="13" rx="4" fill="#6b7084"/>
  <rect x="224" y="286" width="64" height="42" rx="5" fill="#4b5563"/>
  <rect x="204" y="276" width="104" height="16" rx="4" fill="#6b7084"/>

  <!-- Flame outer -->
  <path d="M256 196 C236 224 228 254 242 274 C248 254 260 246 270 250 C262 266 260 284 270 296 C284 312 304 298 304 276 C318 260 316 232 300 214 C298 230 286 236 278 230 C282 210 270 196 256 196Z" fill="url(#fl)"/>
  <!-- Flame inner core -->
  <path d="M260 234 C252 248 250 264 258 276 C268 284 282 276 284 262 C288 248 280 238 272 234 C268 232 264 232 260 234Z" fill="url(#fl2)" opacity="0.9"/>

  <!-- Growth arrow (up-right) -->
  <line x1="194" y1="296" x2="306" y2="184" stroke="#f59e0b" stroke-width="13" stroke-linecap="round" opacity="0.8"/>
  <polygon points="306,184 281,196 295,210" fill="#f59e0b" opacity="0.8"/>

  <!-- FORGE wordmark -->
  <text x="256" y="416" font-family="Arial Black,Impact,sans-serif" font-size="58" font-weight="900" fill="#f59e0b" text-anchor="middle" letter-spacing="5">FORGE</text>
  <!-- Subtitle -->
  <text x="256" y="440" font-family="Arial,sans-serif" font-size="15" fill="#374151" text-anchor="middle" letter-spacing="3">ACCOUNTABILITY</text>
</svg>
