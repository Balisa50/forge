<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Maskable variant: same logo but scaled to fit inside the 80% safe zone
       Android adaptive icons crop. Background fills the full 512x512 so the
       launcher can mask it to circle/squircle/rounded-square without showing
       transparent corners. -->
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#060608"/>
    </linearGradient>
    <linearGradient id="flame2" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="innerFlame2" x1="50%" y1="20%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg2)"/>
  <!-- Logo group scaled to ~70% and centered, inside the safe zone -->
  <g transform="translate(102 102) scale(0.6)">
    <path
      d="M256 50
         C 200 130, 168 168, 168 240
         C 168 280, 188 308, 212 318
         C 212 280, 232 256, 252 252
         C 240 296, 248 326, 276 348
         C 312 372, 344 354, 360 326
         C 396 304, 422 256, 422 204
         C 422 160, 396 124, 364 110
         C 370 144, 354 168, 336 168
         C 308 168, 296 138, 302 96
         C 290 86, 274 76, 256 50 Z"
      fill="url(#flame2)"
      stroke="#fde68a"
      stroke-width="4"
      stroke-linejoin="round"
    />
    <path
      d="M278 218
         C 260 248, 256 274, 272 292
         C 296 312, 328 296, 332 274
         C 336 248, 320 226, 302 218
         C 292 214, 284 214, 278 218 Z"
      fill="url(#innerFlame2)"
      opacity="0.92"
    />
  </g>
</svg>
